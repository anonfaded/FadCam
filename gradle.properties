# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override
# any settings specified in this file.
# For more details on configuring Gradle, see:
# https://docs.gradle.org/current/userguide/build_environment.html
#
# The app packages a large native multimedia stack. Give the Android/Gradle
# packaging workers enough heap to read and assemble those native artifacts.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with the app's APK
# https://developer.android.com/topic/libraries/support-library/supporting-fragments
android.useAndroidX=true
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class
android.nonTransitiveRClass=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true
org.gradle.configuration-cache=true
