# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override settings specified here.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used for decoupled projects.
# org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true
org.gradle.configuration-cache=true
# CI disables the native VFS watcher explicitly as well; keeping this project-wide
# prevents the same Gradle 8.13 watcher collision during local repeated builds.
org.gradle.vfs.watch=false
