name: Apply verified production tools wiring

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply wiring and README update
        run: |
          set -euo pipefail
          if grep -q 'PRODUCTION_TOOLS_WIRED_V1' app/src/main/java/com/fadcam/ui/SettingsHomeFragment.java; then
            echo 'Production tools already wired; nothing to apply.'
            exit 0
          fi
          python3 tools/apply-production-tools.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fadcam/ui/SettingsHomeFragment.java \
                  app/src/main/java/com/fadcam/ui/HomeSidebarFragment.java \
                  app/src/main/AndroidManifest.xml \
                  app/src/main/res/layout/fragment_settings_home.xml \
                  README.md
          git commit -m 'feat: wire production tools and remove coming soon states'
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0 || sleep $((attempt*3))
          done
          exit 1
      - name: Remove one-shot workflow and patcher
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-production-tools.yml tools/apply-production-tools.py
          git commit -m 'chore: remove one-shot production tools wiring'
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0 || sleep $((attempt*3))
          done
          exit 1
