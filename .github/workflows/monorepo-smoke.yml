name: Monorepo Smoke
on:
  push:
    branches: [fused-tv-foundation, overhaul/foundation-audit]
  pull_request:
    branches: [fused-tv-foundation]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {submodules: recursive}
      - name: Validate compose
        run: docker compose -f deployment/docker-compose.yml config
      - name: Build orchestrated services
        run: docker compose -f deployment/docker-compose.yml build core core-test gateway production playout epg monetization analytics
      - name: Start control plane
        run: docker compose -f deployment/docker-compose.yml up -d postgres core gateway production playout epg monetization analytics
      - name: Core API contract matrix
        run: docker compose -f deployment/docker-compose.yml run --rm core-test
      - name: Migration ledger assertion
        run: docker compose -f deployment/docker-compose.yml exec -T postgres psql -U fad -d fad -tAc "SELECT count(*) FROM schema_migrations" | grep -qx '3'
      - name: Health check
        run: |
          set -eu
          check() {
            local url="$1"
            for i in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then return 0; fi
              sleep 2
            done
            echo "Health check failed: $url"
            return 1
          }
          check http://localhost:8080/api/v1/health
          check http://localhost:8081/health
          check http://localhost:8082/health
          check http://localhost:8083/health
          check http://localhost:8084/health
          check http://localhost:8085/health
          check http://localhost:8086/health
      - name: Database reliability and migration recovery gate
        run: bash tests/reliability/db-reliability.sh
      - name: Tear down smoke stack
        if: always()
        run: docker compose -f deployment/docker-compose.yml down -v
      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose -f deployment/docker-compose.yml ps -a || true
          docker compose -f deployment/docker-compose.yml logs --no-color --tail=250 core core-test gateway production playout epg monetization analytics postgres mediamtx || true
