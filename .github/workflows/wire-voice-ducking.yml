name: Wire and verify voice ducking

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: contains(github.event.head_commit.message, 'feat: wire voice ducking') == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Wire recorder microphone telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/fadcam/fadrec/encoding/ScreenRecordingPipeline.java')
          s = path.read_text()
          marker = 'PRODUCTION_AUDIO_DUCKING_WIRED_V1'
          if marker not in s:
              import_anchor = 'import com.fadcam.opengl.WatermarkInfoProvider;\n'
              if import_anchor not in s:
                  raise SystemExit('pipeline import anchor not found')
              s = s.replace(import_anchor, import_anchor + 'import com.fadcam.production.ProductionAudioDuckingBus;\n', 1)

              start_anchor = '            audioRecord.startRecording();\n'
              if start_anchor not in s:
                  raise SystemExit('audioRecord start anchor not found')
              s = s.replace(start_anchor, start_anchor + '            if (Constants.AUDIO_SOURCE_MIC.equals(audioSource)) {\n                ProductionAudioDuckingBus.publishCaptureState(true);\n            }\n', 1)

              rms_anchor = '''                    audioBytesCaptured += bytesRead;\n                    // Diagnostics: log the first reads and a periodic health\n'''
              rms_insert = '''                    audioBytesCaptured += bytesRead;\n                    int rms = computeRms(audioBuffer, bytesRead);\n                    if (Constants.AUDIO_SOURCE_MIC.equals(audioSource)) {\n                        ProductionAudioDuckingBus.publishRms(rms);\n                    }\n                    // Diagnostics: log the first reads and a periodic health\n'''
              if rms_anchor not in s:
                  raise SystemExit('audio RMS anchor not found')
              s = s.replace(rms_anchor, rms_insert, 1)

              end_anchor = '''            FLog.i(TAG, "FadRec audio loop ended: chunks=" + readCount\n                    + " bytes=" + audioBytesCaptured\n'''
              end_insert = '''            if (Constants.AUDIO_SOURCE_MIC.equals(audioSource)) {\n                ProductionAudioDuckingBus.publishCaptureState(false);\n            }\n            FLog.i(TAG, "FadRec audio loop ended: chunks=" + readCount\n                    + " bytes=" + audioBytesCaptured\n'''
              if end_anchor not in s:
                  raise SystemExit('audio loop end anchor not found')
              s = s.replace(end_anchor, end_insert, 1)

              old_rms = '''    /** Lightweight RMS of the first 512 samples — detects zero-capture immediately. */\n    private static int computeRms(ByteBuffer buffer, int bytes) {\n        int samples = Math.min(bytes / 2, 512);\n        if (samples <= 0) return 0;\n        long sumSq = 0;\n        for (int i = 0; i < samples; i++) {\n            short s = buffer.getShort(i * 2);\n            sumSq += (long) s * s;\n        }\n        return (int) Math.sqrt((double) sumSq / samples);\n    }\n'''
              new_rms = '''    /** Lightweight little-endian PCM RMS used by diagnostics and voice ducking. */\n    private static int computeRms(ByteBuffer buffer, int bytes) {\n        int samples = Math.min(bytes / 2, 512);\n        if (samples <= 0) return 0;\n        long sumSq = 0;\n        for (int i = 0; i < samples; i++) {\n            int lo = buffer.get(i * 2) & 0xFF;\n            int hi = buffer.get(i * 2 + 1);\n            short sample = (short) (lo | (hi << 8));\n            sumSq += (long) sample * sample;\n        }\n        return (int) Math.sqrt((double) sumSq / samples);\n    }\n\n    // PRODUCTION_AUDIO_DUCKING_WIRED_V1\n'''
              if old_rms not in s:
                  raise SystemExit('computeRms block not found')
              s = s.replace(old_rms, new_rms, 1)
              path.write_text(s)
          else:
              print('Voice ducking telemetry already wired')
          PY

      - name: Verify source invariants
        run: |
          set -euo pipefail
          grep -q 'ProductionAudioDuckingBus' app/src/main/java/com/fadcam/fadrec/encoding/ScreenRecordingPipeline.java
          grep -q 'PRODUCTION_AUDIO_DUCKING_WIRED_V1' app/src/main/java/com/fadcam/fadrec/encoding/ScreenRecordingPipeline.java
          grep -q 'ProductionAudioDucker' app/src/main/java/com/fadcam/production/DuetStudioFragment.java
          grep -q 'AUDIO MIXER' app/src/main/java/com/fadcam/production/DuetStudioFragment.java
          grep -q 'setVolume' app/src/main/java/com/fadcam/production/ProductionAudioDucker.java
          echo 'Voice ducking source invariants: PASS'

      - name: Build and unit-test exact release variant
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDefaultReleaseUnitTest :app:assembleDefaultRelease --stacktrace --no-daemon --no-watch-fs --no-configuration-cache --max-workers=2

      - name: Commit verified wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Trendyzima'
          git config user.email 'momanyitrendy@gmail.com'
          git add app/src/main/java/com/fadcam/fadrec/encoding/ScreenRecordingPipeline.java .github/workflows/wire-voice-ducking.yml
          git commit -m 'feat: wire voice ducking into recorder mic telemetry'
          git push origin HEAD:master
