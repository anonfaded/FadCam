name: FadCam Android + Platform Validation

on:
  push:
    branches: [master, feat/platform-services-android-safe, feature/reliable-rtmp-publishing]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      # Server integrations are deployment-time dependencies and must not block
      # the Android checkout/build.
      - name: Checkout Android source
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media3-patched
          git clone --depth 1 --branch release https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          test -d /tmp/media3-patched/libraries/muxer
          test -d /tmp/media3-patched/libraries/common
          test -d /tmp/media3-patched/libraries/container

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDefaultDebugUnitTest --stacktrace --no-daemon

      - name: Assemble default debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace --no-daemon

      - name: Sanity-check debug APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/default/debug/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: no default debug APK was produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Checking $apk"
            test -s "$apk"
            unzip -tq "$apk" >/dev/null
          done

      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fadcam-default-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  android-release:
    name: Android default release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media3-patched
          git clone --depth 1 --branch release https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          test -d /tmp/media3-patched/libraries/muxer
          test -d /tmp/media3-patched/libraries/common
          test -d /tmp/media3-patched/libraries/container

      - name: Create ephemeral CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fadcam-ci-release.keystore" \
            -storetype PKCS12 \
            -alias fadcam-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=FadCam CI,O=FadCam,C=US"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/fadcam-ci-release.keystore"
            echo "KEYSTORE_PASSWORD=changeit"
            echo "KEY_ALIAS=fadcam-ci"
            echo "KEY_PASSWORD=changeit"
          } >> local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble default release APK
        run: ./gradlew assembleDefaultRelease --stacktrace --no-daemon

      - name: Verify release APKs are present and structurally valid
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/default/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: no default release APK was produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Checking $apk"
            test -s "$apk"
            unzip -tq "$apk" >/dev/null
          done

      - name: Verify release APK alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/default/release/*.apk)
          for apk in "${apks[@]}"; do
            "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
            "$build_tools/apksigner" verify --verbose "$apk"
            echo "✓ Signed and aligned: $apk"
          done

      - name: Publish release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fadcam-default-release-apk
          path: app/build/outputs/apk/default/release/*.apk
          if-no-files-found: error
          retention-days: 7

  integration-tests:
    name: Existing integration test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test sources
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media3-patched
          git clone --depth 1 --branch release https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          test -d /tmp/media3-patched/libraries/muxer
          test -d /tmp/media3-patched/libraries/common
          test -d /tmp/media3-patched/libraries/container

      - name: Run all existing JVM test suites
        run: |
          chmod +x ./gradlew
          ./gradlew test --stacktrace --no-daemon

      - name: Report instrumentation-test availability
        shell: bash
        run: |
          set -euo pipefail
          if find app/src -maxdepth 2 -type d -name androidTest -print -quit | grep -q .; then
            echo "Instrumentation test source set detected. It will be enabled as a future device-gate once device fixtures are available."
          else
            echo "WARNING: no app/src/**/androidTest source set exists on this commit. The integration gate therefore covers all existing JVM tests; no instrumentation tests were silently fabricated."
          fi

  server-config:
    name: Validate server Compose configuration
    runs-on: ubuntu-latest
    steps:
      # Compose validation only needs the tracked deployment manifests. It does
      # not need to materialize upstream source repositories.
      - name: Checkout deployment manifests
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Validate Compose configuration
        run: docker compose --env-file server/.env.example -f server/docker-compose.yml config --quiet

  rtmp-e2e:
    name: RTMP -> MediaMTX -> HLS end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout streaming test harness
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run deterministic RTMP -> MediaMTX -> HLS smoke test
        run: |
          chmod +x server/tests/rtmp-e2e-smoke.sh
          ./server/tests/rtmp-e2e-smoke.sh
