name: FadCam Android + Platform Validation

on:
  push:
    branches: [master, feat/platform-services-android-safe, feature/reliable-rtmp-publishing]
  pull_request:
    branches: [master]

# PR jobs execute repository-controlled build scripts. Keep the default token
# read-only; release publication grants write permission only to its dedicated
# master-only job below.
permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media3-patched
          git clone --depth 1 --branch release https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          test -d /tmp/media3-patched/libraries/muxer
          test -d /tmp/media3-patched/libraries/common
          test -d /tmp/media3-patched/libraries/container

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDefaultDebugUnitTest --stacktrace --no-daemon

      - name: Compile Android IPC instrumentation tests
        run: ./gradlew :app:compileDefaultDebugAndroidTestJavaWithJavac --stacktrace --no-daemon

      - name: Assemble default debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace --no-daemon

      - name: Sanity-check debug APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/default/debug/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: no default debug APK was produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Checking $apk"
            test -s "$apk"
            unzip -tq "$apk" >/dev/null
          done

      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fadcam-default-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  android-release:
    name: Android default release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media3-patched
          git clone --depth 1 --branch release https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          test -d /tmp/media3-patched/libraries/muxer
          test -d /tmp/media3-patched/libraries/common
          test -d /tmp/media3-patched/libraries/container

      - name: Create ephemeral CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fadcam-ci-release.keystore" \
            -storetype PKCS12 \
            -alias fadcam-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=FadCam CI,O=FadCam,C=US"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/fadcam-ci-release.keystore"
            echo "KEYSTORE_PASSWORD=changeit"
            echo "KEY_ALIAS=fadcam-ci"
            echo "KEY_PASSWORD=changeit"
          } >> local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble default release APK
        run: ./gradlew assembleDefaultRelease --stacktrace --no-daemon

      - name: Verify release APKs are present and structurally valid
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/default/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: no default release APK was produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Checking $apk"
            test -s "$apk"
            unzip -tq "$apk" >/dev/null
          done

      - name: Verify release APK alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/default/release/*.apk)
          for apk in "${apks[@]}"; do
            "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
            "$build_tools/apksigner" verify --verbose "$apk"
            echo "✓ Signed and aligned: $apk"
          done

      - name: Publish release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fadcam-default-release-apk
          path: app/build/outputs/apk/default/release/*.apk
          if-no-files-found: error
          retention-days: 7

  publish-latest-apks:
    name: Publish public latest APKs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [android, android-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v5
        with:
          name: fadcam-default-debug-apk
          path: public-apks/debug

      - name: Download release APK artifact
        uses: actions/download-artifact@v5
        with:
          name: fadcam-default-release-apk
          path: public-apks/release

      - name: Prepare public APK filenames
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debug=(public-apks/debug/*.apk)
          release=(public-apks/release/*.apk)
          test "${#debug[@]}" -gt 0
          test "${#release[@]}" -gt 0
          cp "${debug[0]}" public-apks/FadCam-debug.apk
          cp "${release[0]}" public-apks/FadCam-release.apk
          sha256sum public-apks/FadCam-debug.apk public-apks/FadCam-release.apk | tee public-apks/SHA256SUMS.txt

      - name: Create or update public latest CI release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view latest-ci >/dev/null 2>&1; then
            gh release create latest-ci \
              --target "$GITHUB_SHA" \
              --title "FadCam Latest CI Build" \
              --prerelease \
              --notes "Automatically published from the latest successful master validation run. Commit: $GITHUB_SHA"
          else
            gh release edit latest-ci \
              --title "FadCam Latest CI Build" \
              --notes "Automatically updated from the latest successful master validation run. Commit: $GITHUB_SHA" \
              --prerelease
          fi

          for asset in FadCam-debug.apk FadCam-release.apk SHA256SUMS.txt; do
            gh release delete-asset latest-ci "$asset" --yes >/dev/null 2>&1 || true
          done

          gh release upload latest-ci \
            public-apks/FadCam-debug.apk \
            public-apks/FadCam-release.apk \
            public-apks/SHA256SUMS.txt

      - name: Verify public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view latest-ci --json assets --jq '.assets[].name' | grep -Fx 'FadCam-debug.apk'
          gh release view latest-ci --json assets --jq '.assets[].name' | grep -Fx 'FadCam-release.apk'
          gh release view latest-ci --json assets --jq '.assets[].name' | grep -Fx 'SHA256SUMS.txt'

  integration-tests:
    name: Existing JVM integration/test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test sources
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media3-patched
          git clone --depth 1 --branch release https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          test -d /tmp/media3-patched/libraries/muxer
          test -d /tmp/media3-patched/libraries/common
          test -d /tmp/media3-patched/libraries/container

      - name: Run existing supported default JVM test suites
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDefaultDebugUnitTest :app:testDefaultReleaseUnitTest --stacktrace --no-daemon

      - name: Report instrumentation-test availability
        shell: bash
        run: |
          set -euo pipefail
          if find app/src -maxdepth 2 -type d -name androidTest -print -quit | grep -q .; then
            echo "Instrumentation test source set detected. Device-backed execution remains a separate hardware gate."
          else
            echo "WARNING: no app/src/**/androidTest source set exists on this commit."
          fi

  server-config:
    name: Validate server Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment manifests
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Validate Compose configuration
        run: docker compose --env-file server/.env.example -f server/docker-compose.yml config --quiet

  rtmp-e2e:
    name: RTMP -> MediaMTX -> HLS end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout streaming test harness
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run deterministic RTMP -> MediaMTX -> HLS smoke test
        run: |
          chmod +x server/tests/rtmp-e2e-smoke.sh
          ./server/tests/rtmp-e2e-smoke.sh
