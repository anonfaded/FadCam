name: FadCam Android + Platform Validation

on:
  push:
    branches: [master, feat/platform-services-android-safe, feature/reliable-rtmp-publishing]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621

jobs:
  android:
    name: Android debug + release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media3-patched
          git clone https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          cd /tmp/media3-patched
          git checkout --detach "${MEDIA3_PATCHED_SHA}"
          test "$(git rev-parse HEAD)" = "${MEDIA3_PATCHED_SHA}"
          test -d libraries/muxer
          test -d libraries/common
          test -d libraries/container

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDefaultDebugUnitTest --stacktrace --no-daemon

      - name: Assemble default debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace --no-daemon

      - name: Assemble default release APK
        run: ./gradlew assembleDefaultRelease --stacktrace --no-daemon

  server-config:
    name: Validate server Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment manifests
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Validate Compose configuration
        run: docker compose --env-file server/.env.example -f server/docker-compose.yml config --quiet

  rtmp-e2e:
    name: RTMP -> MediaMTX -> HLS end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout streaming test harness
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run deterministic RTMP -> MediaMTX -> HLS smoke test
        run: |
          chmod +x server/tests/rtmp-e2e-smoke.sh
          ./server/tests/rtmp-e2e-smoke.sh
