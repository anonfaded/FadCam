name: Build and Verify FadCam Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ master, studio-dashboard ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: fadcam-studio-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build, verify and package Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone patched Media3
        run: git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Verify Gradle wrapper
        run: |
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run Android unit tests
        run: ./gradlew test --stacktrace

      - name: Build Studio debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk -type f -name '*.apk' -print | sort)
          test "${#APKS[@]}" -gt 0
          printf '%s\n' "${APKS[@]}"
          for apk in "${APKS[@]}"; do
            test -s "$apk"
            file "$apk"
            sha256sum "$apk"
          done

      - name: Verify APK is a valid ZIP/APK container
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          unzip -t "$apk" >/tmp/apk-unzip-test.txt
          grep -q 'No errors detected' /tmp/apk-unzip-test.txt
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$apk" | grep -q 'classes.dex'

      - name: Verify Studio APK package metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee /tmp/aapt-badging.txt
          grep -q "package: name='com.fadcam'" /tmp/aapt-badging.txt

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -print0 | xargs -0 sha256sum > app/build/outputs/apk/SHA256SUMS.txt
          cat app/build/outputs/apk/SHA256SUMS.txt

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: FadCam-Studio-APK
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
