name: Build and Verify FadCam Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ master, studio-dashboard ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: fadcam-studio-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug:
    name: Build, test, verify and publish Studio APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone patched Media3
        run: git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched

      - name: Verify patched Media3 checkout
        run: |
          set -euo pipefail
          test -f /tmp/media3-patched/settings.gradle || test -f /tmp/media3-patched/settings.gradle.kts
          git -C /tmp/media3-patched rev-parse --verify HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Verify Gradle wrapper
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run Studio debug JVM unit tests
        run: ./gradlew :app:testDefaultDebugUnitTest --stacktrace --no-daemon

      - name: Run full Studio lint audit without masking Studio errors
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew :app:lintDefaultDebug --stacktrace --no-daemon
          lint_exit=$?
          set -e
          report="app/build/intermediates/lint_intermediate_text_report/defaultDebug/lintReportDefaultDebug/lint-results-defaultDebug.txt"
          if [ ! -f "$report" ]; then
            echo "Lint report was not produced."
            exit "$lint_exit"
          fi
          studio_errors="$(grep -E 'app/src/(main|debug)/.*\/studio\/.*Error:' "$report" || true)"
          if [ -n "$studio_errors" ]; then
            echo "Studio lint errors detected:"
            echo "$studio_errors"
            exit 1
          fi
          if [ "$lint_exit" -ne 0 ]; then
            echo "Project-wide lint has pre-existing legacy findings outside the Studio package."
            echo "Studio-specific lint audit passed; compilation and APK verification remain blocking gates."
          fi

      - name: Build Studio debug APK
        run: ./gradlew :app:assembleDefaultDebug --stacktrace --no-daemon

      - name: Verify APK output and identify universal APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk -type f -name '*.apk' -print | sort)
          test "${#APKS[@]}" -gt 0
          UNIVERSAL="$(printf '%s\n' "${APKS[@]}" | grep -E -- '-universal\.apk$' | head -n 1 || true)"
          if [ -z "$UNIVERSAL" ]; then
            UNIVERSAL="${APKS[0]}"
          fi
          test -s "$UNIVERSAL"
          mkdir -p app/build/verified
          cp "$UNIVERSAL" app/build/verified/FadCam-Studio-debug-universal.apk
          echo "apk=app/build/verified/FadCam-Studio-debug-universal.apk" >> "$GITHUB_OUTPUT"
          sha256sum app/build/verified/FadCam-Studio-debug-universal.apk | tee app/build/verified/SHA256SUMS.txt

      - name: Verify APK container and required files
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.apk }}"
          unzip -t "$apk" >/tmp/apk-unzip-test.txt
          grep -q 'No errors detected' /tmp/apk-unzip-test.txt
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$apk" | grep -q 'classes.dex'

      - name: Verify package metadata and 16KB alignment
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.apk }}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee /tmp/aapt-badging.txt
          grep -q "package: name='com.fadcam.beta'" /tmp/aapt-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"

      - name: Publish verified APK release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view studio-latest >/dev/null 2>&1; then
            gh release delete studio-latest --yes --cleanup-tag
          fi
          gh release create studio-latest \
            "${{ steps.apk.outputs.apk }}" \
            --target "$GITHUB_SHA" \
            --title "FadCam Studio — latest verified" \
            --notes "Automated Studio debug APK built and verified by GitHub Actions. Commit: $GITHUB_SHA" \
            --prerelease

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FadCam-Studio-APK
          path: |
            app/build/verified/FadCam-Studio-debug-universal.apk
            app/build/verified/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
