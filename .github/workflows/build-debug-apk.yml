name: Build and Verify FadCam Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ master, studio-dashboard ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

# Give every commit its own queue slot. GitHub otherwise keeps only one
# pending run in a shared concurrency group, which can hide the run we need.
concurrency:
  group: fadcam-studio-apk-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-studio-release:
    name: Build, test, verify and publish Studio release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone patched Media3
        run: git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched

      - name: Verify patched Media3 checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/media3-patched/settings.gradle || test -f /tmp/media3-patched/settings.gradle.kts
          git -C /tmp/media3-patched rev-parse --verify HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Create isolated CI release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/ci-signing
          STOREPASS="$(openssl rand -hex 24)"
          KEYPASS="$(openssl rand -hex 24)"
          keytool -genkeypair \
            -keystore app/ci-signing/fadcam-ci-release.jks \
            -storetype JKS \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            -alias fadcam-ci-release \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=FadCam CI Release, OU=FadCam, O=Trendyzima, L=CI, ST=CI, C=KE" \
            -noprompt
          {
            echo "KEYSTORE_FILE=ci-signing/fadcam-ci-release.jks"
            echo "KEYSTORE_PASSWORD=$STOREPASS"
            echo "KEY_ALIAS=fadcam-ci-release"
            echo "KEY_PASSWORD=$KEYPASS"
          } >> local.properties
          keytool -list -v \
            -keystore app/ci-signing/fadcam-ci-release.jks \
            -storepass "$STOREPASS" \
            -alias fadcam-ci-release \
            | tee /tmp/fadcam-ci-cert.txt
          ! grep -qi 'Android Debug' /tmp/fadcam-ci-cert.txt

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run Studio release JVM unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDefaultReleaseUnitTest --stacktrace --no-daemon

      - name: Run Studio release lint audit
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew :app:lintDefaultRelease --stacktrace --no-daemon
          lint_exit=$?
          set -e

          # AGP has changed the exact lint report directory across releases.
          # Locate the generated report instead of depending on one hard-coded path.
          mapfile -t reports < <(find app/build -type f \( \
            -name 'lint-results-defaultRelease.txt' -o \
            -name 'lint-results-defaultRelease.xml' -o \
            -name 'lint-results-defaultRelease.html' \
          \) -print | sort)

          if [ "${#reports[@]}" -eq 0 ]; then
            echo "ERROR: lint did not produce a defaultRelease report."
            exit 1
          fi

          echo "Lint reports found:"
          printf '%s\n' "${reports[@]}"

          studio_errors=""
          for report in "${reports[@]}"; do
            matches="$(grep -E 'app/src/(main|release)/.*studio.*Error:' "$report" 2>/dev/null || true)"
            if [ -n "$matches" ]; then
              studio_errors="$studio_errors$matches\n"
            fi
          done

          if [ -n "$studio_errors" ]; then
            echo "ERROR: Studio lint errors detected:"
            printf '%b' "$studio_errors"
            exit 1
          fi

          if [ "$lint_exit" -ne 0 ]; then
            echo "Project-wide lint returned non-zero because of legacy findings outside Studio."
            echo "Studio-specific lint audit passed; the release compilation and APK verification gates remain blocking."
          else
            echo "Studio lint audit completed successfully."
          fi

      - name: Build non-debuggable Studio release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDefaultRelease --stacktrace --no-daemon

      - name: Verify APK output and identify universal APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk -type f -name '*.apk' -print | sort)
          echo "APK outputs:"
          printf '%s\n' "${APKS[@]}"
          test "${#APKS[@]}" -gt 0

          UNIVERSAL="$(printf '%s\n' "${APKS[@]}" | grep -E -- '-universal\.apk$' | head -n 1 || true)"
          if [ -z "$UNIVERSAL" ]; then
            UNIVERSAL="${APKS[0]}"
          fi

          test -s "$UNIVERSAL"
          mkdir -p app/build/verified
          cp "$UNIVERSAL" app/build/verified/FadCam-Studio-release-universal.apk
          echo "apk=app/build/verified/FadCam-Studio-release-universal.apk" >> "$GITHUB_OUTPUT"
          sha256sum app/build/verified/FadCam-Studio-release-universal.apk | tee app/build/verified/SHA256SUMS.txt

      - name: Verify APK container and required files
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.apk }}"
          unzip -t "$apk" >/tmp/apk-unzip-test.txt
          grep -q 'No errors detected' /tmp/apk-unzip-test.txt
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$apk" | grep -q 'classes.dex'

      - name: Verify release package, non-debuggable flag, signature and 16KB alignment
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.apk }}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee /tmp/aapt-badging.txt
          grep -q "package: name='com.fadcam'" /tmp/aapt-badging.txt
          ! grep -q 'application-debuggable' /tmp/aapt-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee /tmp/apk-certs.txt
          ! grep -qi 'Android Debug' /tmp/apk-certs.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"

      - name: Verify release manifest has no legacy high-risk declarations
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.apk }}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | tee /tmp/apk-permissions.txt
          ! grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' /tmp/apk-permissions.txt
          ! grep -q 'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' /tmp/apk-permissions.txt
          ! grep -q 'android.permission.SYSTEM_ALERT_WINDOW' /tmp/apk-permissions.txt
          ! "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q 'FadRecScreenshotAccessibilityService'

      - name: Verify APK does not contain debug-only package
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.apk }}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.fadcam'"
          ! "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q 'com.fadcam.beta'

      - name: Publish verified APK release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.apk }}"

          # Replace the rolling release cleanly. If an old release exists, remove
          # it and its tag before creating the new release at this exact commit.
          if gh release view studio-latest >/dev/null 2>&1; then
            gh release delete studio-latest --yes --cleanup-tag
          fi

          # Fail early with a useful message if GitHub has not removed the old tag.
          if git ls-remote --tags origin refs/tags/studio-latest | grep -q 'refs/tags/studio-latest'; then
            echo 'ERROR: studio-latest tag still exists after release cleanup.'
            exit 1
          fi

          gh release create studio-latest \
            "$apk" \
            --target "$GITHUB_SHA" \
            --title "FadCam Studio — latest verified release APK" \
            --notes "Non-debuggable FadCam Studio APK built and verified by GitHub Actions. Commit: $GITHUB_SHA. CI uses a dedicated non-debug release key generated only on the ephemeral runner; configure a protected production signing key before public distribution or Play Store submission." \
            --prerelease

          gh release view studio-latest --json tagName,targetCommitish,isDraft,isPrerelease

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v5
        with:
          name: FadCam-Studio-Release-APK
          path: |
            app/build/verified/FadCam-Studio-release-universal.apk
            app/build/verified/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
