name: Build FadCam with MediaMTX

on:
  workflow_dispatch:
  push:
    branches: [feature/mediamtx-android-integration]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Fetch patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media3-patched
          git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
      - name: Build MediaMTX for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/mediamtx
          git clone --depth 1 https://github.com/bluenviron/mediamtx.git .ci/mediamtx
          mkdir -p app/src/main/jniLibs/arm64-v8a
          pushd .ci/mediamtx
          go generate ./...
          export CGO_ENABLED=1
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          GOOS=android GOARCH=arm64 go build -trimpath -ldflags='-s -w -checklinkname=0' -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmediamtx.so" .
          popd
          chmod 755 app/src/main/jniLibs/arm64-v8a/libmediamtx.so
      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "APK: $apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FadCam-MediaMTX-debug
          path: app/build/outputs/apk/**/*.apk
