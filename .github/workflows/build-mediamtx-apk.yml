name: Build FadCam with MediaMTX

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mediamtx-android-integration

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build MediaMTX for Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/mediamtx
          git clone --depth 1 https://github.com/bluenviron/mediamtx.git .ci/mediamtx
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          pushd .ci/mediamtx

          # MediaMTX requires generated embedded assets before compilation.
          go generate ./...

          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmediamtx.so" .
          CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libmediamtx.so" .
          popd
          chmod 755 app/src/main/jniLibs/arm64-v8a/libmediamtx.so app/src/main/jniLibs/armeabi-v7a/libmediamtx.so

      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "APK: $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FadCam-MediaMTX-debug
          path: app/build/outputs/apk/**/*.apk
