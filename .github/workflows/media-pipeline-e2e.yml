name: Media Pipeline E2E

on:
  push:
    branches: [fused-tv-foundation]
  pull_request:
    branches: [fused-tv-foundation]

jobs:
  media-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install test dependencies
        run: node --version

      - name: Run full media and storage E2E
        run: bash tests/media-pipeline/run-storage-e2e.sh

      - name: Collect logs
        if: always()
        run: docker compose -f deployment/docker-compose.e2e.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f deployment/docker-compose.e2e.yml down -v --remove-orphans
