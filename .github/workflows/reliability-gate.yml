name: Reliability Gate
on:
  push:
    branches: [overhaul/foundation-audit]
  pull_request:
    branches: [fused-tv-foundation]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify Gradle toolchain
        run: |
          chmod +x ./gradlew
          ./gradlew --version
      - name: Android unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Verify debug APK
        run: find app/build/outputs/apk -type f -name '*.apk' -print -quit | grep -q '\.apk$'
