services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fad
      POSTGRES_USER: fad
      POSTGRES_PASSWORD: fad-e2e-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fad -d fad"]
      interval: 2s
      timeout: 3s
      retries: 30

  core:
    build:
      context: ../services/core
    environment:
      PORT: 8080
      DATABASE_URL: postgres://fad:fad-e2e-password@postgres:5432/fad
      CORE_SERVICE_TOKEN: e2e-core-service-token-0123456789
      AUTH_BOOTSTRAP_SECRET: e2e-device-bootstrap-secret-0123456789
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  mediamtx:
    image: bluenviron/mediamtx:1
    command: ["/mediamtx.yml"]
    volumes:
      - ./mediamtx.e2e.yml:/mediamtx.yml:ro
      - recordings:/recordings
    ports:
      - "1935:1935"
      - "9997:9997"

  gateway:
    build:
      context: ../services/gateway
    environment:
      PORT: 8081
      CORE_API_URL: http://core:8080
      CORE_SERVICE_TOKEN: e2e-core-service-token-0123456789
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_API_USER: api-e2e
      MEDIAMTX_API_PASSWORD: api-e2e-pass
      UPSTREAM_TIMEOUT_MS: 5000
    depends_on:
      - core
      - mediamtx
    ports:
      - "8081:8081"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: fad-e2e
      MINIO_ROOT_PASSWORD: fad-e2e-password
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"

  ffmpeg-publisher:
    image: jrottenberg/ffmpeg:6.0-ubuntu
    depends_on:
      - mediamtx
    volumes:
      - recordings:/recordings
    command: >-
      -re -f lavfi -i testsrc=size=640x360:rate=10
      -f lavfi -i sine=frequency=1000:sample_rate=48000
      -t 60 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p
      -c:a aac -f flv "rtmp://mediamtx:1935/e2e-test?user=publisher&pass=publisher-pass"

  recording-inspector:
    image: alpine:3.22
    volumes:
      - recordings:/recordings:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["find /recordings -type f -print"]

  minio-uploader:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    volumes:
      - recordings:/recordings:ro

volumes:
  recordings:
    name: fad-e2e-recordings
