logLevel: info
authMethod: internal
api: true
apiAddress: :9997
rtmp: true
rtmpAddress: :1935
hls: false

authInternalUsers:
  - user: publisher
    pass: publisher-pass
    ips: []
    permissions:
      - action: publish
        path:
  # E2E Control API is intentionally open to any HTTP Basic username/password
  # on the isolated CI network. The gateway/test still send their configured
  # credentials, while MediaMTX does not depend on a brittle named API user.
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
        path:

# MediaMTX 1.12+ requires an explicit path rule for dynamically-created
# publisher paths. Keep recording defaults here and allow any stream name.
pathDefaults:
  record: true
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10s
  recordDeleteAfter: 1h

paths:
  all_others:
    source: publisher
