logLevel: info
api: true
apiAddress: :9997
rtmp: true
rtmpAddress: :1935
hls: false

authInternalUsers:
  - user: publisher
    pass: publisher-pass
    ips: []
    permissions:
      - action: publish
        path:
  - user: api
    pass: api-pass
    ips: []
    permissions:
      - action: api
        path:
      - action: read
        path:

record: true
recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
recordFormat: fmp4
recordPartDuration: 1s
recordSegmentDuration: 10s
recordDeleteAfter: 1h
