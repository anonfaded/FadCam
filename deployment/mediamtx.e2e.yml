logLevel: info
authMethod: internal
api: true
apiAddress: :9997
rtmp: true
rtmpAddress: :1935
hls: false

authInternalUsers:
  - user: publisher
    pass: publisher-pass
    ips:
      - 0.0.0.0/0
      - ::/0
    permissions:
      - action: publish
        path:
  - user: api
    pass: api-pass
    ips:
      - 0.0.0.0/0
      - ::/0
    permissions:
      - action: api
        path:
      - action: read
        path:

# MediaMTX 1.12+ requires an explicit path rule for dynamically-created
# publisher paths. Keep recording defaults here and allow any stream name.
pathDefaults:
  record: true
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10s
  recordDeleteAfter: 1h

paths:
  all_others:
    source: publisher
