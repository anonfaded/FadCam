logLevel: info
authMethod: internal
api: true
apiAddress: :9997
rtmp: true
rtmpAddress: :1935
hls: false

authInternalUsers:
  - user: publisher
    pass: publisher-pass
    ips:
      - 0.0.0.0/0
      - ::/0
    permissions:
      - action: publish

  # The E2E gateway and test use these credentials for the Control API.
  # Keep this as a real named user: an `any` user with an empty password does
  # not authenticate requests that send api-e2e/api-e2e-pass.
  - user: api-e2e
    pass: api-e2e-pass
    ips:
      - 0.0.0.0/0
      - ::/0
    permissions:
      - action: api

# MediaMTX 1.12+ requires an explicit path rule for dynamically-created
# publisher paths. Keep recording defaults here and allow any stream name.
pathDefaults:
  record: true
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10s
  recordDeleteAfter: 1h

paths:
  all_others:
    source: publisher
