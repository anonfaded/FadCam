services:
  ersatztv:
    image: ghcr.io/ersatztv/legacy:v26.7.0
    container_name: fadcam-ersatztv
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:8409:8409"
    volumes:
      - ./data/ersatztv/config:/config
      - ./data/media:/media:ro
    tmpfs:
      - /transcode
    restart: unless-stopped

  ffplayout:
    build:
      context: ./ffplayout-runtime
      dockerfile: Dockerfile
    container_name: fadcam-ffplayout
    profiles: [tv]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOME: /var/lib/ffplayout
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /var/lib/ffplayout
    volumes:
      - ./data/media:/media:ro
      - ./data/ffplayout/config:/config
      - ./data/ffplayout/state:/var/lib/ffplayout
      - ./data/ffplayout/log:/var/log/ffplayout
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      mediamtx:
        condition: service_started
    networks: [tv]

  mediamtx:
    image: bluenviron/mediamtx:1.16.0
    container_name: fadcam-mediamtx
    profiles: [tv]
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8890:8890/udp"
      - "8189:8189/udp"
      - "127.0.0.1:9997:9997"
      - "127.0.0.1:9998:9998"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./data/mediamtx/recordings:/recordings
    networks: [tv]

  # Public edge for FadCam Remote / Server Room. The Android Server Room is
  # untouched: this profile discovers its existing LAN endpoint automatically.
  # No SERVER_ROOM_URL is required. The discovery service scans only private
  # networks visible to the host and only the Server Room's known 8080-8089 range.
  server-room-discovery:
    build:
      context: ./public-gateway
      dockerfile: Dockerfile
    container_name: fadcam-server-room-discovery
    profiles: [public]
    restart: unless-stopped
    network_mode: host
    environment:
      DISCOVERY_PORT: 18080
      SERVER_ROOM_PORT_START: ${SERVER_ROOM_PORT_START:-8080}
      SERVER_ROOM_PORT_END: ${SERVER_ROOM_PORT_END:-8089}
      DISCOVERY_INTERVAL_SECONDS: ${DISCOVERY_INTERVAL_SECONDS:-10}
      DISCOVERY_TIMEOUT_SECONDS: ${DISCOVERY_TIMEOUT_SECONDS:-0.5}
      DISCOVERY_SUBNETS: ${DISCOVERY_SUBNETS:-}

  server-room-gateway:
    image: caddy:2.10.2-alpine
    container_name: fadcam-server-room-gateway
    profiles: [public]
    restart: unless-stopped
    network_mode: host
    depends_on:
      - server-room-discovery
    environment:
      # Default is public HTTP on the host's port 80. Set this to a real DNS
      # hostname to enable Caddy-managed HTTPS automatically.
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-:80}
    volumes:
      - ./public-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: fadcam-prometheus
    profiles: [platform]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks: [platform]

  grafana:
    image: grafana/grafana:13.1.2
    container_name: fadcam-grafana
    profiles: [platform]
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    networks: [platform]

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: fadcam-minio
    profiles: [storage]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    networks: [platform]

  keycloak-db:
    image: postgres:17.11-alpine3.24
    container_name: fadcam-keycloak-db
    profiles: [auth]
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks: [platform]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: fadcam-keycloak
    profiles: [auth]
    restart: unless-stopped
    depends_on:
      - keycloak-db
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    command: start --hostname=localhost --http-enabled=true --http-port=8080
    networks: [platform]

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: fadcam-jellyfin
    profiles: [viewer]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./data/media:/media:ro
    networks: [platform]

networks:
  platform:
    name: fadcam-platform
  tv:
    name: fadcam-tv

volumes:
  prometheus-data:
  grafana-data:
  minio-data:
  keycloak-db-data:
  caddy-data:
  caddy-config:
  jellyfin-config:
  jellyfin-cache:
