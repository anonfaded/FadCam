# FadCam broadcast transport
# ffplayout publishes the programmed channel to RTMP; MediaMTX fans it out
# to viewers through HLS, WebRTC, RTSP and SRT.

rtmp: true
rtmpAddress: :1935

hls: true
hlsAddress: :8888
hlsVariant: fmp4
hlsAlwaysRemux: true
hlsAllowOrigins: ["*"]

webrtc: true
webrtcAddress: :8889

srt: true
srtAddress: :8890

api: true
apiAddress: :9997

metrics: true
metricsAddress: :9998

paths:
  fadcam:
    overridePublisher: true
